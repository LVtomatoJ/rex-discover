[package]
name = "rex-discover"
version = "0.2.0"
edition = "2021"
description = "Discover live Rex servers on Tailscale and local LAN"
authors = ["lvtomatoj"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net"] }
